executor: slurm
jobs: 100
cores: 40
local-cores: 8
default-resources:
  slurm_account: "gdml"
  slurm_partition: "cpu-core"
  runtime: 5
  # NB: can't get mem_mb_per_cpu to work with threads
  mem_mb: threads * 7500
keep-going: True
software-deployment-method:
  - apptainer
  # - conda
apptainer-args: "--bind=$PWD --bind=/data/hps/assoc/private/gdml/user/twil15/1kGP_pipeline/results/1kG/hg38/unrelated/eur/snps_only/005/qc/sans_pars_and_sans_long_range_ld/pruned/1000_1_0_2"
groups:
  - download_topld_reference=pred_ld
  - download_topld_annotation=pred_ld
  - convert_gwas_to_pred_ld_format=pred_ld
  - run_pred_ld_imputation=pred_ld
# group-components:
#   - pred_ld=3
rerun-incomplete: True
nolock: True
max-status-checks-per-second: 1
notemp: False
rerun-triggers: "mtime"
